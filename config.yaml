/**:
  ros__parameters:
    autopilot:
      vehicle_angular_velocity: /fmu/out/vehicle_angular_velocity
      vehicle_attitude: /fmu/out/vehicle_attitude
      vehicle_global_position: /fmu/out/vehicle_global_position
      vehicle_local_position: /fmu/out/vehicle_local_position

    calibration_manager:
      topic: /calibration_manager/calibration_results
      update_ms: 500

    delay_estimator:
      attitude_buffer_size: 4000
      debug: false
      debug_view: false
      feature_buffer_size: 300
      flow:
        expansion: false
        huber_k: 1.345
        max_cost: 0.5
        max_iterations: 20
        min_excitation_rad_s: 0.05
        min_samples: 60
        ridge: 0.001
      horizon:
        huber_k: 1.345
        max_cost: 0.5
        max_iterations: 50
        min_excitation_rad: 0.02
        min_samples: 60
      horizon_buffer_size: 300
      local_position_buffer_size: 2000
      performance_topic: /delay_estimator/performance
      search:
        max_delay_ms: 500
        neighbours: 5
        steps_ms: [20, 5, 1]
      topic: /delay_estimator/delay
      update_ms: 500

    feature_tracker:
      affine:
        min_matches: 12
        min_spread: 0.01
        ransac_threshold: 0.005
      debug_view: false
      horizon_margin_px: 30.0
      orb:
        ransac_confidence: 0.999
        ransac_threshold_px: 1.0
        ratio_test: 0.8
      performance_topic: /feature_tracker/performance
      topic: /feature_tracker/features
      type: orb

    horizon_detection:
      alpha:
        closing:
          kernel_size: 3
        edge_detector:
          canny_high_scale: 1.5
          canny_low_scale: 0.8
        estimator:
          confidance_filter_tau: 0.5
          max_rho_rate: 1.0
          max_theta_rate: 90.0
          minimal_init_score: 0.33
          minimal_update_score: 0.6
          timeout_s: 0.1
        line_detect:
          maximum_line_gap_ratio: 0.025
          minimum_line_length_ratio: 0.1
          rho_resolution_px: 2.0
          theta_resolution_degrees: 0.3
          threshold: 50
        line_grouping:
          distance_tolerance: 0.02
          minimal_coverage: 0.5
          slots: 3
        prefilter:
          bilateral_diameter: 11
          bilateral_sigma_color: 75.0
          bilateral_sigma_space: 75.0
          downscale: 4
          gaussian_kernel_size: 7
      debug_view: true
      detector: alpha
      performance_topic: /horizon_detection/performance
      topic: /horizon_detection/horizon

    image:
      topic: /flightgear/image
      transport: compressed

    stream_telemetry:
      topic: /stream_telemetry/stream_telemetry

    telemetry_synchronizer:
      topic: /telemetry_synchronizer/autopilot_telemetry
