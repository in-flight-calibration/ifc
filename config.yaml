/**:
  ros__parameters:
    image:
      topic: /flightgear/image
      transport: compressed

    horizon:
      detector: alpha
      topic: /horizon_detection/horizon
      debug_view: true
      alpha:
        prefilter:
          bilateral_diameter: 11
          bilateral_sigma_color: 75.0
          bilateral_sigma_space: 75.0
          gaussian_kernel_size: 7
        edge_detector:
          canny_low_scale: 0.8
          canny_high_scale: 2.0
        closing:
          kernel_size: 7
        # HoughLinesP (lengths relative to image width)
        line_detect:
          rho_resolution_px: 3.0
          theta_resolution_degrees: 1.0
          threshold: 50
          minimum_line_length_ratio: 0.2
          maximum_line_gap_ratio: 0.025
        line_grouping:
          angle_tolerance_degrees: 2.0
          rho_tolerance: 0.025
          slots: 5
        estimator:
          minimum_coverage: 0.1
          minimum_score: 0.5
          ambiguity_margin: 0.1
          stale_seconds: 0.1
          max_theta_rate_degrees_per_second: 90.0
          max_rho_rate_per_second: 1.0
          tau_rise_seconds: 0.5
          minimum_confidence: 0.3
          switch_confirmation_frames: 2
